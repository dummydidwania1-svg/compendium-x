<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case CompendiumX</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #fff8f0;
      font-family: 'Work Sans', sans-serif;
      color: #3B2F2F;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
    }
    @keyframes tie-swing {
      0%,100% { transform: rotate(-5deg); }
      50%      { transform: rotate(5deg); }
    }
    @keyframes breathe {
      0%,100% { opacity: 0.35; }
      50%      { opacity: 0.6; }
    }
    .tie {
      transform-origin: top center;
      animation: tie-swing 3s cubic-bezier(0.37,0,0.63,1) infinite;
    }
    .headline {
      font-size: 15px;
      font-weight: 500;
      color: rgba(59,47,47,0.75);
      letter-spacing: -0.01em;
    }
    .sub {
      font-size: 12px;
      color: rgba(92,64,51,0.4);
      text-align: center;
      max-width: 280px;
      line-height: 1.7;
      animation: breathe 3.5s ease-in-out infinite;
    }
    .btn {
      margin-top: 8px;
      padding: 9px 22px;
      border-radius: 999px;
      background: #3D5A35;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.2s;
    }
    .btn:hover { background: #4a6e40; }
  </style>
</head>
<body>
  <div class="page">
    <div class="tie">
      <svg viewBox="0 0 64 64" fill="none" width="28" height="28">
        <path d="M16 10h32l-8 14 5 8-13 22-13-22 5-8-8-14Z" fill="#5C4033" opacity="0.18"/>
        <path d="M32 24 27 32h10l-5-8Z" fill="#3D5A35" opacity="0.5"/>
      </svg>
    </div>
    <p class="headline">You're offline</p>
    <p class="sub">Previously opened cases are still available. Head to the repository to browse them.</p>
    <button class="btn" onclick="window.location.href='/repository'">Go to repository</button>
  </div>
</body>
</html>
