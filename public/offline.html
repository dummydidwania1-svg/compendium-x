<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case CompendiumX</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #fff8f0; font-family: 'Work Sans', sans-serif; color: #3B2F2F; -webkit-font-smoothing: antialiased; }

    .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 32px; }

    @keyframes tie-swing { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes breathe   { 0%,100% { opacity: 0.4; } 50% { opacity: 0.75; } }
    @keyframes rise      { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }

    .tie { transform-origin: top center; animation: tie-swing 2.8s cubic-bezier(0.37,0,0.63,1) infinite; margin-bottom: 22px; }
    .knot { animation: breathe 2.8s ease-in-out infinite; }

    .card {
      animation: rise 0.6s cubic-bezier(0.16,1,0.3,1) both;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      background: rgba(255,248,240,0.9);
      border: 1px solid rgba(61,90,53,0.10);
      border-radius: 20px;
      padding: 36px 32px 28px;
      max-width: 340px; width: 100%;
      box-shadow: 0 4px 24px rgba(59,47,47,0.06);
      text-align: center;
    }

    .headline { font-size: 17px; font-weight: 600; color: #3B2F2F; letter-spacing: -0.01em; }
    .sub {
      font-size: 13px; color: rgba(92,64,51,0.52); line-height: 1.7;
      animation: breathe 3.5s ease-in-out 0.6s infinite;
    }

    .btn {
      margin-top: 6px;
      padding: 10px 26px;
      border-radius: 999px;
      background: #3D5A35;
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      letter-spacing: 0.01em;
      box-shadow: 0 4px 12px rgba(61,90,53,0.18);
      transition: background 0.2s, transform 0.15s;
    }
    .btn:hover { background: #4a6e40; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .note {
      font-size: 11px;
      color: rgba(92,64,51,0.32);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="tie">
      <svg viewBox="0 0 64 64" fill="none" width="32" height="32">
        <path d="M16 10h32l-8 14 5 8-13 22-13-22 5-8-8-14Z" fill="#5C4033" opacity="0.18"/>
        <path class="knot" d="M32 24 27 32h10l-5-8Z" fill="#3D5A35" opacity="0.5"/>
      </svg>
    </div>
    <div class="card">
      <p class="headline">You're offline right now</p>
      <p class="sub">No worries, your case library is still here. Browse any case you like, even without a connection.</p>
      <button class="btn" onclick="window.location.href='/repository'">Open the library</button>
      <p class="note">Forum and practice mode need a connection</p>
    </div>
  </div>
</body>
</html>
